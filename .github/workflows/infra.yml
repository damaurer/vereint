name: Infrastruktur

# Prueft den Terraform-Code unter `infra/` auf Formatierung und Gueltigkeit.
# Es wird nichts angewendet und kein AWS-Zugang benoetigt; Sicherheitsregeln
# prueft zusaetzlich Trivy im Workflow `Security`.
on:
  push:
    branches:
      - develop
      - main
      - qs
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    branches:
      - develop
      - main
      - qs
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform pruefen
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dir: [infra/aws, infra/aws/bootstrap]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform einrichten
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3

      - name: Formatierung pruefen
        run: terraform fmt -check -recursive -diff
        working-directory: ${{ matrix.dir }}

      - name: Initialisieren (ohne Backend)
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: Validieren
        run: terraform validate
        working-directory: ${{ matrix.dir }}
