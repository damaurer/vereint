name: webservice CI/CD

# Diese Action ist ausschliesslich fuer den `webservice` zustaendig und
# wird nur ausgefuehrt, wenn sich etwas im Ordner `webservice/` oder an
# diesem Workflow selbst geaendert hat (siehe `paths`-Filter).
#
# Die Tests werden jedes Mal ausgefuehrt.
# Das Docker-Image wird nur gebaut und nach GitHub Packages (ghcr.io) deployed,
# wenn der Merge auf den Branch `qs` abgeschlossen ist (push-Event auf `qs`).
on:
  push:
    branches:
      - main
      - qs
    paths:
      - 'webservice/**'
      - '.github/workflows/webservice-docker.yml'
  pull_request:
    branches:
      - main
      - qs
    paths:
      - 'webservice/**'
      - '.github/workflows/webservice-docker.yml'

jobs:
  test:
    name: Tests ausfuehren
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: webservice/package-lock.json

      - name: Abhaengigkeiten installieren
        run: npm ci
        working-directory: webservice

      - name: Tests ausfuehren
        run: npm test -- --watch=false
        working-directory: webservice

  docker:
    name: Docker Image bauen und deployen
    needs: test
    # Das Image soll nur gebaut werden, wenn der Merge auf `qs` abgeschlossen ist.
    if: github.event_name == 'push' && github.ref == 'refs/heads/qs'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image bauen und nach GitHub Packages pushen
        uses: docker/build-push-action@v6
        with:
          context: webservice
          file: webservice/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/webservice:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/webservice:qs
