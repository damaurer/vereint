name: keycloak CI/CD

# Diese Action ist ausschliesslich fuer den `keycloak` zustaendig und
# wird nur ausgefuehrt, wenn sich etwas im Ordner `keycloak/` oder an
# diesem Workflow selbst geaendert hat (siehe `paths`-Filter).
#
# Bei jedem Pull Request und Push:
#   1. Docker-Image (Realm-Import und Login-Theme eingebaut) bauen und mit Trivy auf bekannte Schwachstellen pruefen
#      (behebbare HIGH/CRITICAL-Funde lassen den Lauf fehlschlagen)
# Nur nach einem Merge auf `qs` oder `main` (push-Event):
#   2. Multi-Arch-Image (amd64 + arm64) nach GitHub Packages (ghcr.io) pushen,
#      getaggt mit Commit-SHA und Branch-Namen. Der SHA-Tag erlaubt es, jede
#      Version gezielt erneut auszurollen bzw. zurueckzurollen.
on:
  push:
    branches:
      - develop
      - main
      - qs
    paths:
      - 'keycloak/**'
      - '.github/workflows/keycloak-docker.yml'
  # Von Hand, z. B. um vor dem ersten Deployment alle Images auf main zu bauen.
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
      - qs
    paths:
      - 'keycloak/**'
      - '.github/workflows/keycloak-docker.yml'

permissions:
  contents: read

concurrency:
  group: keycloak-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/keycloak
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  docker:
    name: Docker Image bauen, pruefen und deployen
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: QEMU fuer arm64 einrichten
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image fuer den Scan bauen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: keycloak
          file: keycloak/Dockerfile
          load: true
          tags: keycloak:scan
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,scope=keycloak,mode=max

      - name: Image mit Trivy auf Schwachstellen pruefen
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore \
            keycloak:scan

      - name: An GitHub Container Registry anmelden
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/qs' || github.ref == 'refs/heads/main')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Multi-Arch-Image nach GitHub Packages pushen
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/qs' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: keycloak
          file: keycloak/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=keycloak
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
