name: Deployment (Produktion)

# Rollt den Stand von `main` auf den Server aus (siehe deploy/README.md).
#
# Ausgeloest wird das Deployment
#   - nachdem ein Image-Workflow auf `main` erfolgreich ein Image gepusht hat,
#   - bei Aenderungen an deploy/ oder website/ auf `main`,
#   - von Hand (Actions -> Deployment -> Run workflow), auch als Rollback.
#
# Der Job laeuft nur im Environment `production` und bindet alle drei Images an
# ihren Digest. Zwei Ziele sind moeglich:
#   - Eigener Server (z. B. Strato VPS, docs/betrieb/strato.md): ist die
#     Variable DEPLOY_HOST gesetzt, geht das Bundle per SSH an den Server. Der
#     Schluessel darf dort nur `deploy` und `rollback` ausloesen.
#   - AWS (infra/aws): sonst meldet sich der Job per OIDC bei AWS an, legt das
#     Bundle in S3 ab und startet es per AWS Systems Manager.
# Auf dem Server sichert `bin/deploy.sh` vorher die Datenbanken, prueft danach
# die Gesundheit und kehrt bei einem Fehler automatisch zum vorherigen Stand
# zurueck.
on:
  workflow_run:
    workflows:
      - baseservice CI/CD
      - webservice CI/CD
      - keycloak CI/CD
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'website/**'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/ssm-run.sh'
      - '.github/scripts/ssh-run.sh'
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy = aktuellen Stand von main ausrollen, rollback = vorherigen Stand wiederherstellen'
        type: choice
        options: [deploy, rollback]
        default: deploy

permissions:
  contents: read

# Deployments laufen nacheinander, nie parallel und nie abgebrochen.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Auf den Server ausrollen
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    permissions:
      contents: read
      packages: read
      actions: read
      id-token: write

    env:
      TARGET: ${{ vars.DEPLOY_HOST != '' && 'ssh' || 'aws' }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      INSTANCE_ID: ${{ vars.VEREINT_INSTANCE_ID }}
      DEPLOY_BUCKET: ${{ vars.VEREINT_DEPLOY_BUCKET }}
      ACTION: ${{ inputs.action || 'deploy' }}

    steps:
      - name: Konfiguration pruefen
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          if [ "$TARGET" = ssh ]; then
            [ -n "$SSH_KEY" ] || missing="$missing Secret:DEPLOY_SSH_KEY"
            [ -n "$DEPLOY_SSH_KNOWN_HOSTS" ] || missing="$missing Variable:DEPLOY_SSH_KNOWN_HOSTS"
            doc=docs/betrieb/strato.md
          else
            [ -n "$ROLE" ] || missing="$missing Secret:AWS_DEPLOY_ROLE_ARN"
            [ -n "$INSTANCE_ID" ] || missing="$missing Variable:VEREINT_INSTANCE_ID"
            [ -n "$DEPLOY_BUCKET" ] || missing="$missing Variable:VEREINT_DEPLOY_BUCKET"
            doc=infra/aws/README.md
          fi
          if [ -n "$missing" ]; then
            echo "::error::Im Environment production fehlt:$missing (siehe $doc)"
            exit 1
          fi
          echo "Ziel: $TARGET"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Laufende Image-Builds abwarten
        if: env.ACTION == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Damit nicht ein halb fertiger Stand mit gemischten Versionen ausrollt.
          for wf in baseservice-docker.yml webservice-docker.yml keycloak-docker.yml; do
            for _ in $(seq 1 60); do
              running="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --branch main \
                --json status --jq '[.[] | select(.status != "completed")] | length')"
              [ "$running" = 0 ] && continue 2
              echo "$wf laeuft noch, warte ..."
              sleep 30
            done
            echo "::error::$wf ist nach 30 Minuten noch nicht fertig"
            exit 1
          done

      - name: Bei AWS anmelden (OIDC)
        if: env.TARGET == 'aws'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: vereint-deploy-${{ github.run_id }}

      - name: An GitHub Container Registry anmelden
        if: env.ACTION == 'deploy'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Images an ihren Digest binden
        if: env.ACTION == 'deploy'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          : > images.env
          for svc in keycloak baseservice webservice; do
            digest="$(docker buildx imagetools inspect "ghcr.io/$owner/$svc:main" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Kein Image ghcr.io/$owner/$svc:main gefunden"; exit 1; }
            echo "${svc^^}_IMAGE=ghcr.io/$owner/$svc@$digest" >> images.env
          done
          cat images.env
          {
            echo "### Ausgerollte Images"
            echo '```'
            cat images.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle packen
        if: env.ACTION == 'deploy'
        run: |
          bundle="$RUNNER_TEMP/bundle"
          cp -r deploy "$bundle"
          rm -f "$bundle"/.env "$bundle"/.env.*
          # Statische Website; Caddy liefert sie aus dem Bundle aus.
          cp -r website "$bundle/website"
          cp images.env "$bundle/images.env"

      - name: Bundle nach S3 hochladen
        if: env.ACTION == 'deploy' && env.TARGET == 'aws'
        run: |
          tar -czf "$RUNNER_TEMP/bundle.tgz" -C "$RUNNER_TEMP/bundle" .
          key="deploy/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          aws s3 cp "$RUNNER_TEMP/bundle.tgz" "s3://$DEPLOY_BUCKET/$key" --sse AES256 --only-show-errors
          echo "BUNDLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Auf dem Server ausfuehren (AWS Systems Manager)
        if: env.TARGET == 'aws'
        env:
          # Kurzlebig: GitHub widerruft das Token, sobald dieser Job endet.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/ssm-run.sh

      - name: Auf dem Server ausfuehren (SSH)
        if: env.TARGET == 'ssh'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: .github/scripts/ssh-run.sh
