name: baseservice CI/CD

# Diese Action ist ausschliesslich fuer den `baseservice` zustaendig und
# wird nur ausgefuehrt, wenn sich etwas im Ordner `baseservice/` oder an
# diesem Workflow selbst geaendert hat (siehe `paths`-Filter).
#
# Bei Push auf develop, qs und main und bei Pull Requests develop -> qs und
# qs -> main:
#   1. Tests ausfuehren
#   2. Docker-Image bauen und mit Trivy auf bekannte Schwachstellen pruefen
#      (behebbare HIGH/CRITICAL-Funde lassen den Lauf fehlschlagen)
# Nur nach einem Merge auf `qs` oder `main` (push-Event):
#   3. Multi-Arch-Image (amd64 + arm64) nach GitHub Packages (ghcr.io) pushen,
#      getaggt mit Commit-SHA und Branch-Namen. Der SHA-Tag erlaubt es, jede
#      Version gezielt erneut auszurollen bzw. zurueckzurollen.
#   4. Den gepushten Digest mit cosign signieren (Schluessel aus dem
#      Environment `signatur-main` bzw. `signatur-qs`, ohne oeffentliches
#      Transparenz-Log). Wer ausrollt, kann die Signatur vorher pruefen.
on:
  push:
    branches:
      - develop
      - main
      - qs
    paths:
      - 'baseservice/**'
      - '.github/workflows/baseservice-docker.yml'
  # Von Hand, z. B. um vor dem ersten Deployment alle Images auf main zu bauen.
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - qs
    paths:
      - 'baseservice/**'
      - '.github/workflows/baseservice-docker.yml'

permissions:
  contents: read

concurrency:
  group: baseservice-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vereint-baseservice
  # Dieselbe cosign-Version wie beim Pruefen auf dem Server nehmen; cosign 3
  # legt Signaturen anders ab.
  COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v2.6.5@sha256:ad281047f85c5e1fc6ffbc30c2b55be3b07b4032bef715a12122ce5829619aca
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  test:
    name: Tests ausfuehren
    # Nur fuer main, qs und develop und fuer Pull Requests develop -> qs und
    # qs -> main aus diesem Repository (siehe docs/betrieb/branches-und-ci.md).
    if: >-
      (github.event_name != 'pull_request'
        && contains(fromJSON('["main", "qs", "develop"]'), github.ref_name))
      || (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && ((github.base_ref == 'qs' && github.head_ref == 'develop')
          || (github.base_ref == 'main' && github.head_ref == 'qs')))
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 25 einrichten
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Gradle Wrapper ausfuehrbar machen
        run: chmod +x gradlew
        working-directory: baseservice

      - name: Tests ausfuehren
        run: ./gradlew test
        working-directory: baseservice

  docker:
    name: Docker Image bauen und pruefen
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: QEMU fuer arm64 einrichten
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image fuer den Scan bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: baseservice
          file: baseservice/Dockerfile
          load: true
          tags: baseservice:scan
          cache-from: type=gha,scope=baseservice
          cache-to: type=gha,scope=baseservice,mode=max

      - name: Image mit Trivy auf Schwachstellen pruefen
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore \
            baseservice:scan

  push:
    name: Image pushen und signieren
    needs: docker
    # Nur fuer `main` und `qs`: Fuer jeden anderen Branch wuerde GitHub ein
    # leeres Environment `signatur-<branch>` anlegen und das Signieren
    # schluege mangels Schluessel fehl. Pull Requests pushen nie.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'qs')
    runs-on: ubuntu-24.04
    environment: signatur-${{ github.ref_name }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: QEMU fuer arm64 einrichten
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: An GitHub Container Registry anmelden
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Multi-Arch-Image nach GitHub Packages pushen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: baseservice
          file: baseservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=baseservice
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=vereint-baseservice
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}

      # Signiert wird der Digest, auf den `:main` bzw. `:qs` jetzt zeigt (der
      # Multi-Arch-Index). cosign laeuft als Runner-Benutzer, damit es die
      # Anmeldung aus ~/.docker/config.json lesen kann.
      - name: Image signieren
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGN_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error::Secret COSIGN_PRIVATE_KEY fehlt im Environment signatur-${{ github.ref_name }}"
            exit 1
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e DOCKER_CONFIG=/docker-config \
            -e COSIGN_PRIVATE_KEY -e COSIGN_PASSWORD \
            -v "$HOME/.docker:/docker-config:ro" \
            "$COSIGN_IMAGE" \
            sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false "$SIGN_REF"
