name: baseservice CI/CD

# Diese Action ist ausschliesslich fuer den `baseservice` zustaendig und
# wird nur ausgefuehrt, wenn sich etwas im Ordner `baseservice/` oder an
# diesem Workflow selbst geaendert hat (siehe `paths`-Filter).
#
# Bei jedem Pull Request und Push:
#   1. Tests ausfuehren
#   2. Docker-Image bauen und mit Trivy auf bekannte Schwachstellen pruefen
#      (behebbare HIGH/CRITICAL-Funde lassen den Lauf fehlschlagen)
# Nur nach einem Merge auf `qs` oder `main` (push-Event):
#   3. Multi-Arch-Image (amd64 + arm64) nach GitHub Packages (ghcr.io) pushen,
#      getaggt mit Commit-SHA und Branch-Namen. Der SHA-Tag erlaubt es, jede
#      Version gezielt erneut auszurollen bzw. zurueckzurollen.
on:
  push:
    branches:
      - develop
      - main
      - qs
    paths:
      - 'baseservice/**'
      - '.github/workflows/baseservice-docker.yml'
  # Von Hand, z. B. um vor dem ersten Deployment alle Images auf main zu bauen.
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
      - qs
    paths:
      - 'baseservice/**'
      - '.github/workflows/baseservice-docker.yml'

permissions:
  contents: read

concurrency:
  group: baseservice-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/baseservice
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  test:
    name: Tests ausfuehren
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 25 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Gradle Wrapper ausfuehrbar machen
        run: chmod +x gradlew
        working-directory: baseservice

      - name: Tests ausfuehren
        run: ./gradlew test
        working-directory: baseservice

  docker:
    name: Docker Image bauen, pruefen und deployen
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: QEMU fuer arm64 einrichten
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Image fuer den Scan bauen
        uses: docker/build-push-action@v7
        with:
          context: baseservice
          file: baseservice/Dockerfile
          load: true
          tags: baseservice:scan
          cache-from: type=gha,scope=baseservice
          cache-to: type=gha,scope=baseservice,mode=max

      - name: Image mit Trivy auf Schwachstellen pruefen
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore \
            baseservice:scan

      - name: An GitHub Container Registry anmelden
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/qs' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Multi-Arch-Image nach GitHub Packages pushen
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/qs' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v7
        with:
          context: baseservice
          file: baseservice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=baseservice
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
