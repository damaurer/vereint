name: Security

# Repository-weite Sicherheitspruefungen, unabhaengig davon, welcher Service
# geaendert wurde:
#   - Gitleaks: sucht in der gesamten Git-Historie nach versehentlich
#     eingecheckten Secrets (Passwoerter, Tokens, Schluessel).
#   - Trivy (Dateisystem): prueft Lockfiles auf bekannte Schwachstellen und
#     Dockerfiles bzw. Infrastruktur-Code auf unsichere Konfiguration.
#   - Doku-Verweise: findet Pfade auf Markdown-Dateien (in Code-Kommentaren,
#     Konfigurationen und Doku), die es im Repository nicht mehr gibt.
# Zusaetzlich laeuft der Workflow woechentlich, damit neu veroeffentlichte
# Schwachstellen auch ohne Code-Aenderung auffallen.
#
# Bekannte Fehlalarme stehen in `.gitleaksignore` bzw. `.trivyignore`.
on:
  push:
    branches:
      - develop
      - main
      - qs
  pull_request:
    branches:
      - develop
      - main
      - qs
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets suchen (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (gesamte Historie)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks ausfuehren
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --verbose

  dependencies:
    name: Abhaengigkeiten und Konfiguration pruefen (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy ausfuehren
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore \
            .

  doc-references:
    name: Doku-Verweise pruefen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tote Verweise auf Markdown-Dateien suchen
        run: |
          missing=$(git grep -noE "(docs|deploy|infra)/[A-Za-z0-9_./-]+\.md" \
            | while IFS=: read -r f l p; do [ -e "$p" ] || echo "$f:$l $p"; done)
          if [ -n "$missing" ]; then
            echo "Verweise auf nicht vorhandene Dateien:"
            echo "$missing"
            exit 1
          fi
