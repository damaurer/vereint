# Dependabot oeffnet woechentlich Pull Requests fuer veraltete bzw. unsichere
# Abhaengigkeiten. Sicherheitsupdates kommen zusaetzlich sofort.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /baseservice
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /webservice
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      npm:
        patterns: ['*']
        exclude-patterns: ['@angular/*', '@angular-devkit/*']
    ignore:
      # Angular gibt die TypeScript-Version vor (Angular 22: >=6.0 <6.1).
      # Erst mit dem Angular-Update anheben, das den neuen Major unterstuetzt.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Die Typen folgen der Node-Laufzeit im Dockerfile (node:22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories:
      - /baseservice
      - /webservice
    schedule:
      interval: weekly

  # Actions sind auf Commit-SHAs gepinnt (Kommentar = Tag); Dependabot
  # aktualisiert SHA und Kommentar gemeinsam.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
