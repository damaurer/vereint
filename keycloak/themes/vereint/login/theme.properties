# Vereint Login-Theme (Basis: keycloak.v2 aus Keycloak 26.1.4, PatternFly 5).
# Ueberschrieben werden nur template.ftl, login.ftl, login-reset-password.ftl
# und register.ftl; alle weiteren Login-Seiten werden aus keycloak.v2 geerbt
# und erhalten ueber template.ftl + css/vereint.css automatisch das Branding.
parent=keycloak.v2
import=common/keycloak

locales=de,en
darkMode=true

styles=css/styles.css css/vereint.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# Eigene Klassen-Hooks; alle uebrigen kc*-Properties (Inputs, Buttons,
# Alerts, Checkboxen ...) bleiben aus keycloak.v2 erhalten.
kcHtmlClass=login-pf vereint-html
kcBodyClass=vereint-body
kcLoginClass=vereint-login
kcFormCardClass=vereint-card
kcLogoClass=vereint-logo
