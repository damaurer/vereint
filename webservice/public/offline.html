<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Offline – Vereint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="/vereint-app-icon.svg">
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --muted: #475569; --brand: #1e3a8a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1120; --surface: #111827; --text: #e2e8f0; --muted: #94a3b8; --brand: #93c5fd; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 26rem; width: 100%; text-align: center; padding: 2rem 1.5rem;
      background: var(--surface); border-radius: 1rem; box-shadow: 0 1px 3px rgba(15, 23, 42, .15);
    }
    img { width: 4rem; height: 4rem; }
    h1 { font-size: 1.35rem; margin: 1rem 0 .5rem; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; }
    a {
      display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem;
      padding: 0 1.25rem; border-radius: 999px; background: var(--brand); color: var(--surface);
      font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/vereint-app-icon.svg" alt="">
    <h1>Keine Verbindung</h1>
    <p>Vereint braucht eine Internetverbindung, damit Guthaben, Striche und Nachrichten immer aktuell sind. Prüfe dein WLAN oder deine mobilen Daten.</p>
    <a href="/">Erneut versuchen</a>
  </main>
</body>
</html>
