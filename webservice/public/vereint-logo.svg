<svg xmlns="http://www.w3.org/2000/svg" width="440" height="140" viewBox="0 0 440 140" role="img" aria-label="vereint">
  <title>vereint</title>
  <defs>
    <linearGradient id="vereintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ec4b6"/>
      <stop offset="0.55" stop-color="#3a86ff"/>
      <stop offset="1" stop-color="#8338ec"/>
    </linearGradient>
  </defs>

  <!-- Bildmarke: vernetzte Knoten, die sich zu einer Gemeinschaft vereinen -->
  <!-- Farbige Variante im Stil von vereint-logo-mono.svg (offener Rahmen, farbige Linien/Knoten) -->
  <g transform="translate(20 20)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="none"
          stroke="url(#vereintGrad)" stroke-width="4"/>

    <!-- Verbindungslinien (uebergreifender Chat / Netzwerk) -->
    <g stroke="url(#vereintGrad)" stroke-width="3.5" stroke-linecap="round">
      <line x1="50" y1="50" x2="28" y2="30"/>
      <line x1="50" y1="50" x2="72" y2="30"/>
      <line x1="50" y1="50" x2="28" y2="72"/>
      <line x1="50" y1="50" x2="72" y2="72"/>
    </g>

    <!-- Knoten: einzelne Gruppen / Stammtische / Vereine -->
    <g fill="url(#vereintGrad)">
      <circle cx="28" cy="30" r="8"/>
      <circle cx="72" cy="30" r="8"/>
      <circle cx="28" cy="72" r="8"/>
      <circle cx="72" cy="72" r="8"/>
    </g>

    <!-- Zentraler Knoten: die verbindende Dachplattform -->
    <circle cx="50" cy="50" r="11" fill="url(#vereintGrad)"/>
  </g>

  <!-- Wortmarke -->
  <text x="140" y="88"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#1b1f3b">vere</tspan><tspan fill="url(#vereintGrad)">int</tspan>
  </text>
</svg>
