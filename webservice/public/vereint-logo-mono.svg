<svg xmlns="http://www.w3.org/2000/svg" width="440" height="140" viewBox="0 0 440 140" role="img" aria-label="vereint">
  <title>vereint</title>

  <!-- Einfarbige Variante fuer Druck, Praegung und einfarbige Hintergruende. -->
  <!-- currentColor erlaubt Einfaerbung ueber CSS (color) im Web. -->
  <g fill="currentColor" color="#1b1f3b">

    <!-- Bildmarke -->
    <g transform="translate(20 20)">
      <rect x="0" y="0" width="100" height="100" rx="26" fill="none"
            stroke="currentColor" stroke-width="4"/>

      <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
        <line x1="50" y1="50" x2="28" y2="30"/>
        <line x1="50" y1="50" x2="72" y2="30"/>
        <line x1="50" y1="50" x2="28" y2="72"/>
        <line x1="50" y1="50" x2="72" y2="72"/>
      </g>

      <circle cx="28" cy="30" r="8"/>
      <circle cx="72" cy="30" r="8"/>
      <circle cx="28" cy="72" r="8"/>
      <circle cx="72" cy="72" r="8"/>
      <circle cx="50" cy="50" r="11"/>
    </g>

    <!-- Wortmarke -->
    <text x="140" y="88"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="58" font-weight="700" letter-spacing="-1.5"
          fill="currentColor">vereint</text>
  </g>
</svg>
