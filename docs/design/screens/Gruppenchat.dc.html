<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gruppenchat</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Meine Gruppe" back-href="Chat.dc.html" hint-size="100%,56px"></dc-import>

  <aside role="note" style="flex-shrink: 0; display: flex; gap: 10px; margin: 12px 16px 0; padding: 12px 14px; border-radius: 12px; background-color: var(--color-brand-soft)">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--color-brand)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M9 3.5h6l-1 5.5 3 3V14H7v-2l3-3z"/><line x1="12" y1="14" x2="12" y2="20.5"/></svg>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 700">Infotafel · Thomas Berger</span>
      <span style="font-size: 14px; line-height: 1.4">Mitgliederversammlung am 15. November um 19 Uhr im Vereinsheim.</span>
    </div>
  </aside>

  <ol aria-label="Nachrichten" style="flex: 1; min-height: 0; list-style: none; margin: 0; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; overflow: hidden">
    <sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
      <li style="{{m.row}}">
        <span style="{{m.avatar}}">{{m.initials}}</span>
        <div style="{{m.col}}">
          <span style="{{m.head}}"><strong>{{m.author}}</strong> · {{m.time}}</span>
          <span style="{{m.bubble}}">{{m.text}}</span>
        </div>
      </li>
    </sc-for>
  </ol>

  <form style="flex-shrink: 0; display: flex; gap: 8px; padding: 12px 16px 20px; border-top: 1px solid var(--color-border); background-color: var(--color-surface)">
    <button type="button" aria-label="Bild anhängen" style="display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--color-border-dark); border-radius: 999px; background-color: var(--color-surface); color: var(--color-text-muted)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="9.5" r="1.5" fill="currentColor" stroke="none"/><path d="M4 17l5-5 4 4 2.5-2.5L20 18"/></svg>
    </button>
    <label for="msg" class="visually-hidden">Nachricht</label>
    <input id="msg" value="{{draft}}" onChange="{{onDraft}}" placeholder="Nachricht an alle …" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--color-border-dark); border-radius: 999px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
    <button type="button" onClick="{{send}}" aria-label="Senden" style="display: grid; place-items: center; width: 48px; height: 48px; border: none; border-radius: 999px; background-color: var(--color-brand); color: var(--color-on-brand)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 20.5 4l-7.5 16.5-2.3-6.7z"/><line x1="10.7" y1="13.8" x2="20.5" y2="4"/></svg>
    </button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      list: [
        { initials: 'TB', author: 'Thomas Berger', text: 'Die Getränkeliste fürs Sommerfest ist abgerechnet. Danke an alle Helfer!', time: '10:24', me: false },
        { initials: 'JK', author: 'Jonas Keller', text: 'Weiß jemand, ob der Schlüssel fürs Vereinsheim wieder beim Wirt liegt?', time: '10:26', me: false },
        { initials: 'SW', author: 'Sabine Wolf', text: 'Ja, liegt hinter der Theke.', time: '10:28', me: false }
      ]
    };
  }
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: () => {
        const t = this.state.draft.trim();
        if (!t) return;
        this.setState({ draft: '', list: this.state.list.concat([{ initials: 'LH', author: 'Du', text: t, time: 'jetzt', me: true }]) });
      },
      messages: this.state.list.slice(-4).map((m) => ({
        initials: m.initials,
        author: m.author,
        text: m.text,
        time: m.time,
        row: 'display: flex; gap: 10px; align-items: flex-end; ' + (m.me ? 'flex-direction: row-reverse' : ''),
        avatar: 'display: grid; place-items: center; width: 34px; height: 34px; flex-shrink: 0; border-radius: 999px; background-color: var(--color-brand); color: var(--color-on-brand); font-size: 12px; font-weight: 800',
        col: 'display: flex; flex-direction: column; gap: 3px; max-width: 78%; ' + (m.me ? 'align-items: flex-end' : ''),
        head: 'color: var(--color-text-muted); font-size: 12px',
        bubble: 'padding: 10px 12px; border-radius: 14px; font-size: 15px; line-height: 1.4; ' + (m.me ? 'background-color: var(--color-brand); color: var(--color-on-brand); border-bottom-right-radius: 4px' : 'background-color: var(--color-surface); border: 1px solid var(--color-border); border-bottom-left-radius: 4px')
      }))
    };
  }
}
</script>
</body>
</html>
