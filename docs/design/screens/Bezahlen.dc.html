<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Getränk bezahlen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--color-border); background-color: var(--color-surface)">
    <a href="Guthaben.dc.html" aria-label="Zurück zum Guthaben" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--color-text)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-size: 17px; font-weight: 800; letter-spacing: -0.01em">Bezahlen</h1>
    <span style="padding: 0 12px; color: var(--color-text-muted); font-size: 14px; font-weight: 600">33,00 €</span>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Mit Guthaben bezahlen</p>
      <h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Getränk scannen</h2>
      <p style="margin: 0; color: var(--color-text-muted); font-size: 15px; line-height: 1.5">Halte den Strichcode in den Rahmen. Abgebucht wird erst, wenn du bestätigst.</p>
    </div>

    <div style="position: relative; height: 200px; flex-shrink: 0; display: grid; place-items: center; border-radius: 16px; background-color: #0f172a; overflow: hidden">
      <div style="position: relative; width: 240px; height: 120px">
        <span style="position: absolute; top: 0; left: 0; width: 28px; height: 28px; border-top: 4px solid #ffffff; border-left: 4px solid #ffffff; border-top-left-radius: 10px"></span>
        <span style="position: absolute; top: 0; right: 0; width: 28px; height: 28px; border-top: 4px solid #ffffff; border-right: 4px solid #ffffff; border-top-right-radius: 10px"></span>
        <span style="position: absolute; bottom: 0; left: 0; width: 28px; height: 28px; border-bottom: 4px solid #ffffff; border-left: 4px solid #ffffff; border-bottom-left-radius: 10px"></span>
        <span style="position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; border-bottom: 4px solid #ffffff; border-right: 4px solid #ffffff; border-bottom-right-radius: 10px"></span>
        <span style="position: absolute; left: 16px; right: 16px; top: 58px; height: 2px; border-radius: 2px; background-color: #5592f7"></span>
      </div>
      <span style="position: absolute; bottom: 12px; color: #cbd5e1; font-size: 13px">Kamera aktiv</span>
    </div>

    <form style="display: flex; flex-direction: column; gap: 6px">
      <label for="barcode" style="color: var(--color-text-muted); font-size: 13px; font-weight: 600">Oder Nummer unter dem Strichcode eintippen</label>
      <div style="display: flex; gap: 8px">
        <input id="barcode" inputmode="numeric" value="4001234500011" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px; font-variant-numeric: tabular-nums">
        <button type="button" aria-label="Suchen" style="display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface); color: var(--color-text)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/></svg>
        </button>
      </div>
    </form>

    <section aria-label="Gefundenes Getränk" style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border: 1px solid var(--color-border); border-radius: 12px; background-color: var(--color-surface)">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="display: grid; place-items: center; width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background-color: var(--color-brand-soft); color: var(--color-brand)">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="8.5" width="11" height="12" rx="2.5"/><path d="M15.5 11h1.5a3 3 0 0 1 3 3v.5a3 3 0 0 1-3 3h-1.5"/><path d="M4.5 9V8a3.2 3.2 0 0 1 4.8-2.8A3.2 3.2 0 0 1 14 5a2.8 2.8 0 0 1 1.5 2.5V9"/><line x1="8.5" y1="12.5" x2="8.5" y2="16.5"/><line x1="11.5" y1="12.5" x2="11.5" y2="16.5"/></svg>
        </span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 17px; font-weight: 700">Helles 0,5 l</span>
          <span style="color: var(--color-text-muted); font-size: 14px">Augustiner · Getränkekatalog</span>
        </div>
        <span style="font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums">3,50 €</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--color-border); color: var(--color-text-muted); font-size: 14px">
        <span>Guthaben danach</span>
        <span style="color: var(--color-text); font-weight: 700; font-variant-numeric: tabular-nums">29,50 €</span>
      </div>
      <a href="BezahlenBestaetigen.dc.html" style="display: grid; place-items: center; height: 52px; border-radius: 8px; background-color: var(--color-brand); color: var(--color-on-brand); font-size: 16px; font-weight: 700; text-decoration: none">Weiter: 3,50 € bezahlen</a>
    </section>
  </main>

  <nav aria-label="Hauptnavigation" style="height: 64px; flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--color-border); background-color: var(--color-surface)">
    <a href="Main.dc.html" style="display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--color-text-muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <span style="display: grid; place-items: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.4 12 4l8 6.4V18a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18z"/><circle cx="12" cy="15.2" r="2" fill="currentColor" stroke="none"/></svg></span>
      Start
    </a>
    <a href="Events.dc.html" style="display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--color-text-muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <span style="display: grid; place-items: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="3.5"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8.5" y1="3.5" x2="8.5" y2="7"/><line x1="15.5" y1="3.5" x2="15.5" y2="7"/><circle cx="15" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg></span>
      Events
    </a>
    <a href="Chat.dc.html" style="display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--color-text-muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <span style="position: relative; display: grid; place-items: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5h11a3.5 3.5 0 0 1 3.5 3.5v6a3.5 3.5 0 0 1-3.5 3.5H12l-4.5 3.5v-3.5h-1A3.5 3.5 0 0 1 3 14V8a3.5 3.5 0 0 1 3.5-3.5z"/><circle cx="8" cy="11" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="11" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="11" r="1.2" fill="currentColor" stroke="none"/></svg><span style="position: absolute; top: -2px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border: 2px solid var(--color-surface); border-radius: 999px; background-color: var(--color-danger); color: #ffffff; font-size: 10px; font-weight: 700; line-height: 14px; text-align: center">6</span></span>
      Chat
    </a>
    <a href="Guthaben.dc.html" style="display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--color-text-muted); font-size: 11px; font-weight: 600; text-decoration: none">
      <span style="display: grid; place-items: center; width: 52px; height: 30px"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="17" height="13" rx="3"/><path d="M6 7 15.6 3.9a1.5 1.5 0 0 1 1.9 1.4V7"/><path d="M20.5 11h-3.5a2.5 2.5 0 0 0 0 5h3.5"/><circle cx="17" cy="13.5" r="1.2" fill="currentColor" stroke="none"/></svg></span>
      Guthaben
    </a>
    <a href="Mehr.dc.html" aria-current="page" style="display: grid; place-content: center; justify-items: center; gap: 2px; color: var(--color-brand); font-size: 11px; font-weight: 800; text-decoration: none">
      <span style="display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; background-color: var(--color-brand-soft)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.9" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.9" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.9" fill="currentColor" stroke="none"/></svg></span>
      Mehr
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
