<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mitteilungen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Mitteilungen" bell="{{unreadText}}" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px; overflow: hidden">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Mitteilungen</p>
        <h2 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Benachrichtigungen</h2>
      </div>
      <span class="ui-badge ui-badge-warning" style="margin-bottom: 6px">{{unreadText}} ungelesen</span>
    </div>
    <button type="button" onClick="{{readAll}}" style="align-self: flex-start; height: 40px; padding: 0 14px; border: 1px solid var(--color-border-dark); border-radius: 999px; background-color: var(--color-surface); color: var(--color-brand); font: inherit; font-size: 14px; font-weight: 700">Alle als gelesen markieren</button>

    <div style="display: flex; gap: 10px; padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 12px; background-color: var(--color-surface)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--color-text-muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><circle cx="12" cy="21" r="1.6" fill="var(--color-text-muted)" stroke="none"/></svg>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 14px; font-weight: 700">Mitteilungen auf diesem Gerät</span>
        <span style="color: var(--color-text-muted); font-size: 13px; line-height: 1.45">Erlaube Mitteilungen, dann bekommst du sie auch bei geschlossener App.</span>
        <a href="Profil.dc.html" style="font-size: 13px; font-weight: 700; text-decoration: none">Einschalten</a>
      </div>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <li style="{{it.card}}">
          <span style="{{it.dot}}" aria-hidden="true"></span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
              <span style="{{it.titleStyle}}">{{it.title}}</span>
              <span class="ui-chip" style="flex-shrink: 0">{{it.tag}}</span>
            </div>
            <span style="color: var(--color-text-muted); font-size: 13px; line-height: 1.4">{{it.body}}</span>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="color: var(--color-text-muted); font-size: 12px">{{it.time}}</span>
              <sc-if value="{{it.unread}}" hint-placeholder-val="{{ true }}">
                <button type="button" onClick="{{it.read}}" style="height: 32px; padding: 0 10px; border: none; border-radius: 6px; background: transparent; color: var(--color-brand); font: inherit; font-size: 13px; font-weight: 700">Gelesen</button>
              </sc-if>
            </div>
          </div>
        </li>
      </sc-for>
    </ul>
  </main>
  <dc-import name="TabBar" active="mehr" hint-size="100%,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { read: {} };
  }
  renderVals() {
    const all = [
      { id: 1, title: 'Mitgliederversammlung am 15. November', tag: 'Rundbrief', body: 'Die Einladung mit Tagesordnung hängt im Vereinsheim aus.', time: 'Heute, 10:24' },
      { id: 2, title: 'Neuer Moment: Prost auf den Vereinsabend!', tag: 'Moment', body: 'Thomas Berger hat einen Moment gestartet. Sei dabei!', time: 'Heute, 10:20' },
      { id: 3, title: 'Neues Event: Weihnachtsfeier', tag: 'Event', body: 'Mi, 16. Dez · 19:00 · Gasthaus Post', time: 'Gestern, 18:02' },
      { id: 4, title: 'Guthaben aufgeladen', tag: 'Guthaben', body: '20,00 € wurden deinem Guthaben gutgeschrieben.', time: '15. Okt, 19:02' }
    ];
    const read = this.state.read;
    const unread = all.filter((n) => !read[n.id]).length;
    return {
      theme: this.props.theme ?? 'light',
      unreadText: String(unread),
      readAll: () => {
        const next = {};
        all.forEach((n) => { next[n.id] = true; });
        this.setState({ read: next });
      },
      items: all.slice(0, 3).map((n) => {
        const u = !read[n.id];
        return {
          title: n.title,
          tag: n.tag,
          body: n.body,
          time: n.time,
          unread: u,
          read: () => this.setState({ read: { ...read, [n.id]: true } }),
          card: 'display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--color-border); background-color: ' + (u ? 'var(--color-surface)' : 'transparent'),
          dot: 'width: 8px; height: 8px; margin-top: 7px; flex-shrink: 0; border-radius: 999px; background-color: ' + (u ? 'var(--color-brand)' : 'transparent'),
          titleStyle: 'font-size: 15px; line-height: 1.3; font-weight: ' + (u ? '700' : '500')
        };
      })
    };
  }
}
</script>
</body>
</html>
