<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gruppe wählen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Gruppen" back-href="Main.dc.html" bell="none" hint-size="100%,56px"></dc-import>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Deine Gruppen</p>
      <h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Gruppe wählen</h2>
      <p style="margin: 0; color: var(--color-text-muted); font-size: 15px; line-height: 1.5">Wähle, in welcher Gruppe du gerade unterwegs bist. Freunde, Kalender und Direktnachrichten gelten für alle.</p>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <li>
          <a href="Main.dc.html" onClick="{{g.pick}}" aria-current="{{g.current}}" style="{{g.style}}">
            <span style="{{g.avatar}}">{{g.initials}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 16px; font-weight: 700">{{g.label}}</span>
              <span style="color: var(--color-text-muted); font-size: 13px">{{g.meta}}</span>
            </span>
            <sc-if value="{{g.isCurrent}}" hint-placeholder-val="{{ false }}">
              <span class="ui-badge ui-badge-success">Aktuell</span>
            </sc-if>
            <sc-if value="{{g.notCurrent}}" hint-placeholder-val="{{ true }}">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--color-text-muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
            </sc-if>
          </a>
        </li>
      </sc-for>
    </ul>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px dashed var(--color-border-dark); border-radius: 12px">
      <a href="GruppeEroeffnen.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; font-weight: 700; text-decoration: none">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Neue Gruppe eröffnen
      </a>
      <p style="margin: 0; color: var(--color-text-muted); font-size: 13px">Du kannst bis zu drei eigene Gruppen eröffnen. Noch 2 frei.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { current: 'mg' };
  }
  renderVals() {
    const list = [
      { id: 'mg', initials: 'MG', label: 'Meine Gruppe', meta: 'Mitglied · 7 Mitglieder' },
      { id: 'sv', initials: 'SV', label: 'Schützenverein Aschau', meta: 'Vorstand · 38 Mitglieder' },
      { id: 'lt', initials: 'LT', label: 'Lauftreff Dienstag', meta: 'Admin · 6 Mitglieder' }
    ];
    return {
      theme: this.props.theme ?? 'light',
      groups: list.map((g) => {
        const on = g.id === this.state.current;
        return {
          initials: g.initials,
          label: g.label,
          meta: g.meta,
          isCurrent: on,
          notCurrent: !on,
          current: on ? 'true' : 'false',
          pick: () => this.setState({ current: g.id }),
          style: 'display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; color: inherit; text-decoration: none; background-color: var(--color-surface); border: ' + (on ? '2px solid var(--color-brand)' : '1px solid var(--color-border)'),
          avatar: 'display: grid; place-items: center; width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; font-size: 16px; font-weight: 800; ' + (on ? 'background-color: var(--color-brand); color: var(--color-on-brand)' : 'background-color: var(--color-brand-soft); color: var(--color-brand)')
        };
      })
    };
  }
}
</script>
</body>
</html>
