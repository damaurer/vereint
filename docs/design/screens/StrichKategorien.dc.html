<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Strich-Kategorien</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Strich-Kategorien" back-href="Vorstand.dc.html" bell="1" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; overflow: hidden">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Strichliste</p>
        <h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Kategorien</h2>
      </div>
      <button type="button" onClick="{{addCat}}" style="height: 40px; padding: 0 12px; border: none; border-radius: 8px; background-color: var(--color-brand); color: var(--color-on-brand); font: inherit; font-size: 14px; font-weight: 700">Neue Kategorie</button>
    </div>
    <p style="margin: 0; padding: 10px 12px; border-radius: 10px; background-color: var(--color-brand-soft); font-size: 13px; line-height: 1.45">Jede Kategorie ist eine Spalte der Strichliste. Ihr Preis gilt für alle zugeordneten Getränke und <strong>überschreibt den Getränkepreis</strong>.</p>

    <sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 12px; background-color: var(--color-surface)">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="flex: 1; font-size: 16px; font-weight: 800">{{c.label}}</span>
          <label for="{{c.inputId}}" style="color: var(--color-text-muted); font-size: 13px">Preis je Strich</label>
          <input id="{{c.inputId}}" inputmode="decimal" value="{{c.price}}" onChange="{{c.onPrice}}" style="width: 72px; height: 38px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums">
          <span style="font-size: 15px; font-weight: 700">€</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{c.drinks}}" as="d" hint-placeholder-count="2">
            <button type="button" onClick="{{d.unassign}}" aria-label="{{d.aria}}" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--color-border); border-radius: 999px; background-color: var(--color-bg); color: var(--color-text); font: inherit; font-size: 13px">
              {{d.label}}
              <span style="{{d.ownStyle}}">{{d.own}}</span>
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <section style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px dashed var(--color-border-dark); border-radius: 12px">
      <h3 style="margin: 0; font-size: 14px; font-weight: 700">Ohne Kategorie · eigener Preis</h3>
      <sc-for list="{{free}}" as="f" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; font-size: 14px">{{f.label}} · {{f.own}}</span>
          <label class="visually-hidden" for="{{f.selId}}">Kategorie für {{f.label}}</label>
          <select id="{{f.selId}}" value="" onChange="{{f.assign}}" style="height: 36px; padding: 0 6px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 13px">
            <option value="">Zuordnen …</option>
            <sc-for list="{{catOptions}}" as="o" hint-placeholder-count="3"><option value="{{o.id}}">{{o.label}}</option></sc-for>
          </select>
        </div>
      </sc-for>
      <sc-if value="{{noFree}}" hint-placeholder-val="{{ false }}"><span style="color: var(--color-text-muted); font-size: 13px">Alle Getränke sind zugeordnet.</span></sc-if>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      cats: [
        { id: 'bier', label: 'Bier', price: '3,50' },
        { id: 'af', label: 'Alkoholfrei', price: '2,50' },
        { id: 'schnaps', label: 'Schnaps', price: '2,00' }
      ],
      drinks: [
        { id: 'helles', label: 'Helles 0,5 l', own: 3.5, cat: 'bier' },
        { id: 'weiss', label: 'Weißbier 0,5 l', own: 3.8, cat: 'bier' },
        { id: 'radler', label: 'Radler 0,5 l', own: 3.2, cat: 'bier' },
        { id: 'schorle', label: 'Apfelschorle', own: 2.5, cat: 'af' },
        { id: 'spezi', label: 'Spezi', own: 2.8, cat: 'af' },
        { id: 'obstler', label: 'Obstler 2 cl', own: 2.0, cat: 'schnaps' },
        { id: 'sekt', label: 'Sekt 0,1 l', own: 4.0, cat: '' },
        { id: 'wasser', label: 'Wasser 0,5 l', own: 1.5, cat: '' }
      ]
    };
  }
  renderVals() {
    const s = this.state;
    const eur = (v) => v.toFixed(2).replace('.', ',') + ' €';
    const num = (v) => parseFloat(String(v).replace(',', '.'));
    const setDrink = (id, cat) => this.setState({ drinks: s.drinks.map((d) => (d.id === id ? { ...d, cat } : d)) });
    const free = s.drinks.filter((d) => !d.cat);
    return {
      theme: this.props.theme ?? 'light',
      addCat: () => {
        if (s.cats.some((c) => c.id === 'wein')) return;
        this.setState({ cats: s.cats.concat([{ id: 'wein', label: 'Wein & Sekt', price: '4,00' }]) });
      },
      catOptions: s.cats.map((c) => ({ id: c.id, label: c.label + ' · ' + c.price + ' €' })),
      cats: s.cats.map((c) => {
        const p = num(c.price);
        return {
          label: c.label, price: c.price, inputId: 'price-' + c.id,
          onPrice: (e) => this.setState({ cats: s.cats.map((x) => (x.id === c.id ? { ...x, price: e.target.value } : x)) }),
          drinks: s.drinks.filter((d) => d.cat === c.id).map((d) => {
            const differs = !isNaN(p) && Math.abs(d.own - p) > 0.001;
            return {
              label: d.label,
              own: differs ? eur(d.own) : '',
              ownStyle: 'color: var(--color-text-muted); text-decoration: line-through; font-size: 12px; display: ' + (differs ? 'inline' : 'none'),
              aria: d.label + ' aus ' + c.label + ' entfernen',
              unassign: () => setDrink(d.id, '')
            };
          })
        };
      }),
      free: free.map((d) => ({ label: d.label, own: eur(d.own), selId: 'cat-' + d.id, assign: (e) => { if (e.target.value) setDrink(d.id, e.target.value); } })),
      noFree: free.length === 0
    };
  }
}
</script>
</body>
</html>
