<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Strich erfasst</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1180px; height: 820px">
  <dc-import name="Theke" theme="{{theme}}" last-stroke="{{yes}}" hint-size="1180px,820px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', yes: true };
  }
}
</script>
</body>
</html>
