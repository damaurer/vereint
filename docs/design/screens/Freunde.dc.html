<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Freunde</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Freunde" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Über alle Gruppen</p>
      <h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Freunde</h2>
      <p style="margin: 0; color: var(--color-text-muted); font-size: 14px; line-height: 1.5">Freunde bleiben, auch wenn ihr keine Gruppe mehr teilt.</p>
    </div>

    <sc-if value="{{hasRequest}}" hint-placeholder-val="{{ true }}">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h3 style="margin: 0; font-size: 15px; font-weight: 700">Anfragen an dich (1)</h3>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 2px solid var(--color-brand); border-radius: 12px; background-color: var(--color-surface)">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; background-color: var(--color-brand); color: var(--color-on-brand); font-size: 14px; font-weight: 800">MS</span>
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Mia Schulz</span><span style="color: var(--color-text-muted); font-size: 13px">Meine Gruppe</span></span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button type="button" onClick="{{accept}}" style="height: 44px; border: none; border-radius: 8px; background-color: var(--color-brand); color: var(--color-on-brand); font: inherit; font-size: 15px; font-weight: 700">Annehmen</button>
            <button type="button" onClick="{{decline}}" style="height: 44px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface); color: var(--color-text); font: inherit; font-size: 15px; font-weight: 600">Ablehnen</button>
          </div>
        </div>
      </section>
    </sc-if>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 15px; font-weight: 700">Deine Freunde ({{friendCount}})</h3>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: 12px; background-color: var(--color-surface)">
        <sc-for list="{{friends}}" as="f" hint-placeholder-count="2">
          <li style="{{f.row}}">
            <span style="display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 999px; background-color: var(--color-brand); color: var(--color-on-brand); font-size: 13px; font-weight: 800">{{f.initials}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{f.label}}</span><span style="color: var(--color-text-muted); font-size: 13px">{{f.group}}</span></span>
            <a href="Direktnachrichten.dc.html" style="display: grid; place-items: center; height: 36px; padding: 0 12px; border-radius: 8px; background-color: var(--color-brand-soft); color: var(--color-brand); font-size: 14px; font-weight: 700; text-decoration: none">Nachricht</a>
          </li>
        </sc-for>
      </ul>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h3 style="margin: 0; font-size: 15px; font-weight: 700">Deine Anfragen (1)</h3>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 12px; background-color: var(--color-surface)">
        <span style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; background-color: var(--color-brand); color: var(--color-on-brand); font-size: 13px; font-weight: 800">FB</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Felix Braun</span><span style="color: var(--color-text-muted); font-size: 13px">Wartet auf Antwort</span></span>
        <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface); color: var(--color-text); font: inherit; font-size: 14px; font-weight: 600">Zurückziehen</button>
      </div>
    </section>
  </main>
  <dc-import name="TabBar" active="mehr" hint-size="100%,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { request: 'open' };
  }
  renderVals() {
    const list = [{ initials: 'JK', label: 'Jonas Keller', group: 'Meine Gruppe' }];
    if (this.state.request === 'accepted') list.unshift({ initials: 'MS', label: 'Mia Schulz', group: 'Meine Gruppe' });
    return {
      theme: this.props.theme ?? 'light',
      hasRequest: this.state.request === 'open',
      accept: () => this.setState({ request: 'accepted' }),
      decline: () => this.setState({ request: 'declined' }),
      friendCount: String(list.length),
      friends: list.map((f, i) => ({ ...f, row: 'display: flex; align-items: center; gap: 12px; padding: 12px 14px' + (i > 0 ? '; border-top: 1px solid var(--color-border)' : '') }))
    };
  }
}
</script>
</body>
</html>
