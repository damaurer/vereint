<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kiosk-Modus starten</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 1180px; height: 820px; box-sizing: border-box; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <header style="height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--color-border); background-color: var(--color-surface)">
    <img src="/_blob/658eacfb311db734fae6de78ff566261" alt="" style="width: 32px; height: 32px; border-radius: 9px">
    <span style="font-size: 20px; font-weight: 800">Thekenterminal</span>
  </header>
  <div aria-hidden="true" style="position: absolute; inset: 0; background-color: rgba(15, 23, 42, 0.4)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="kt" style="position: absolute; left: 50%; top: 50%; width: 480px; margin-left: -240px; margin-top: -270px; display: flex; flex-direction: column; border: 1px solid var(--color-border); border-radius: 16px; background-color: var(--color-surface); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1)">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 16px 24px; border-bottom: 1px solid var(--color-border)">
      <h1 id="kt" style="margin: 0; font-size: 20px; font-weight: 800">Kiosk-Modus starten</h1>
      <a href="Theke.dc.html" aria-label="Schließen" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--color-text-muted)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </a>
    </header>
    <form style="display: flex; flex-direction: column; gap: 14px; padding: 20px 24px 24px">
      <p style="margin: 0; color: var(--color-text-muted); font-size: 15px; line-height: 1.5">Vergib eine PIN für dieses Gerät. Nur mit ihr lässt sich der Kiosk-Modus hier wieder verlassen.</p>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="dn" style="font-size: 14px; font-weight: 600">Gerätename (optional)</label>
        <input id="dn" value="Theke Vereinsheim" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="p1" style="font-size: 14px; font-weight: 600">PIN (4–8 Ziffern)</label>
          <input id="p1" type="password" inputmode="numeric" value="{{p1}}" onChange="{{onP1}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 18px; letter-spacing: 0.3em">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="p2" style="font-size: 14px; font-weight: 600">PIN wiederholen</label>
          <input id="p2" type="password" inputmode="numeric" value="{{p2}}" onChange="{{onP2}}" aria-invalid="{{invalid}}" aria-describedby="perr" style="{{p2Style}}">
        </div>
      </div>
      <p id="perr" role="status" style="{{msgStyle}}">{{msg}}</p>
      <p style="margin: 0; color: var(--color-text-muted); font-size: 13px; line-height: 1.45">PIN vergessen? Vorstand und Administration entsperren das Gerät unter Vorstand › Kiosk-Geräte.</p>
      <div style="display: flex; justify-content: flex-end; gap: 10px">
        <a href="Theke.dc.html" style="display: grid; place-items: center; height: 48px; padding: 0 20px; box-sizing: border-box; border: 1px solid var(--color-border-dark); border-radius: 8px; color: var(--color-text); font-size: 15px; font-weight: 600; text-decoration: none">Abbrechen</a>
        <a href="{{startHref}}" aria-disabled="{{invalid}}" style="{{startStyle}}">Starten</a>
      </div>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p1: '2468', p2: '246' };
  }
  renderVals() {
    const { p1, p2 } = this.state;
    const valid1 = /^\d{4,8}$/.test(p1);
    const match = p1 === p2;
    const ok = valid1 && match;
    let msg = 'Die PINs stimmen überein.';
    if (!valid1) msg = 'Die PIN braucht 4 bis 8 Ziffern.';
    else if (!match) msg = 'Die PINs stimmen noch nicht überein.';
    const field = 'height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 18px; letter-spacing: 0.3em; border: ';
    return {
      theme: this.props.theme ?? 'light',
      p1, p2,
      onP1: (e) => this.setState({ p1: e.target.value }),
      onP2: (e) => this.setState({ p2: e.target.value }),
      invalid: ok ? 'false' : 'true',
      msg,
      msgStyle: 'margin: 0; font-size: 14px; font-weight: 600; color: ' + (ok ? 'var(--color-success)' : 'var(--color-danger)'),
      p2Style: field + (ok || p2 === '' ? '1px solid var(--color-border-dark)' : '2px solid var(--color-danger)'),
      startHref: ok ? 'StrichRueckgaengig.dc.html' : '#',
      startStyle: 'display: grid; place-items: center; height: 48px; padding: 0 24px; border-radius: 8px; font-size: 15px; font-weight: 700; text-decoration: none; ' + (ok ? 'background-color: var(--color-brand); color: var(--color-on-brand)' : 'background-color: var(--color-surface-muted); color: var(--color-text-muted); pointer-events: none')
    };
  }
}
</script>
</body>
</html>
