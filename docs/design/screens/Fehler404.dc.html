<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Nicht gefunden</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Nicht gefunden" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 24px">
    <span style="display: grid; place-items: center; width: 72px; height: 72px; border-radius: 999px; background-color: var(--color-brand-soft); color: var(--color-brand)">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/></svg>
    </span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <p style="margin: 0; color: var(--color-text-muted); font-size: 13px; font-weight: 700; letter-spacing: 0.08em">FEHLER 404</p>
      <h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Diese Seite gibt es nicht</h2>
      <p style="margin: 0; color: var(--color-text-muted); font-size: 16px; line-height: 1.5">Vielleicht wurde das Event gelöscht oder der Link ist veraltet.</p>
    </div>
    <a href="Main.dc.html" style="display: grid; place-items: center; height: 52px; border-radius: 8px; background-color: var(--color-brand); color: var(--color-on-brand); font-size: 16px; font-weight: 700; text-decoration: none">Zur Startseite</a>
  </main>
  <dc-import name="TabBar" active="start" hint-size="100%,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
