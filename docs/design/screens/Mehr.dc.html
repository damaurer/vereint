<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mehr</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Start" hint-size="100%,56px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background-color: rgba(15, 23, 42, 0.4)"></div>
  <section role="dialog" aria-modal="true" aria-label="Mehr" style="position: absolute; left: 0; right: 0; top: 64px; bottom: 0; display: flex; flex-direction: column; border-top-left-radius: 16px; border-top-right-radius: 16px; background-color: var(--color-surface)">
    <span aria-hidden="true" style="width: 40px; height: 5px; margin: 10px auto 0; border-radius: 999px; background-color: var(--color-border-dark)"></span>
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 6px 20px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 800">Mehr</h1>
      <a href="Main.dc.html" aria-label="Schließen" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--color-text-muted)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </a>
    </header>
    <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 16px; overflow: hidden">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; padding: 0 4px; color: var(--color-text-muted); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">{{g.label}}</h2>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
              <a href="{{it.href}}" style="display: grid; justify-items: center; align-content: center; gap: 6px; min-height: 72px; padding: 8px 4px; border: 1px solid var(--color-border); border-radius: 12px; background-color: var(--color-bg); color: var(--color-text); font-size: 12px; font-weight: 600; text-align: center; text-decoration: none">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--color-brand)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.strokeD}}"/><path d="{{it.fillD}}" fill="var(--color-brand)" stroke="none"/></svg>
                {{it.label}}
              </a>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <a href="Abgemeldet.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; margin-top: auto; border: 1px solid var(--color-border); border-radius: 12px; color: var(--color-danger); font-size: 15px; font-weight: 700; text-decoration: none">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4.5H7.5A2.5 2.5 0 0 0 5 7v10a2.5 2.5 0 0 0 2.5 2.5H14"/><path d="M10 12h10"/><path d="M16.5 8.5 20 12l-3.5 3.5"/></svg>
        Abmelden
      </a>
      <p style="margin: 0; text-align: center; font-size: 12px"><a href="Impressum.dc.html">Impressum</a> · <a href="Impressum.dc.html">AGB</a></p>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (d) => ({ s: d });
    const l = (a, b, c, d) => ({ s: 'M' + a + ' ' + b + 'L' + c + ' ' + d });
    const circ = (cx, cy, r) => 'M' + (cx - r) + ' ' + cy + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0';
    const c = (cx, cy, r) => ({ s: circ(cx, cy, r) });
    const n = (cx, cy, r) => ({ f: circ(cx, cy, r || 1.6) });
    const r = (x, y, w, h, q) => ({ s: 'M' + (x + q) + ' ' + y + 'h' + (w - 2 * q) + 'a' + q + ' ' + q + ' 0 0 1 ' + q + ' ' + q + 'v' + (h - 2 * q) + 'a' + q + ' ' + q + ' 0 0 1 ' + (-q) + ' ' + q + 'h' + (2 * q - w) + 'a' + q + ' ' + q + ' 0 0 1 ' + (-q) + ' ' + (-q) + 'v' + (2 * q - h) + 'a' + q + ' ' + q + ' 0 0 1 ' + q + ' ' + (-q) + 'z' });
    const I = {
      moments: [p('M11 3.5c.6 4 2.6 6 6.5 6.5-3.9.6-5.9 2.6-6.5 6.5-.6-3.9-2.6-5.9-6.5-6.5 3.9-.5 5.9-2.5 6.5-6.5z'), n(18.5, 18.5, 1.8), n(5.5, 19.5, 1.1)],
      dm: [p('M6 4.5h8.5A2.5 2.5 0 0 1 17 7v4.5a2.5 2.5 0 0 1-2.5 2.5H9.5l-3.5 3V14a2.5 2.5 0 0 1-2.5-2.5V7A2.5 2.5 0 0 1 6 4.5z'), p('M17 9h1.5A2.5 2.5 0 0 1 21 11.5v4a2.5 2.5 0 0 1-2.5 2.5h-.5v2.5L15 18h-2.5a2.5 2.5 0 0 1-2.4-1.8'), n(10.25, 9.25, 1.3)],
      kalender: [r(4, 5.5, 16, 15, 3.5), l(4, 10, 20, 10), l(8.5, 3.5, 8.5, 7), l(15.5, 3.5, 15.5, 7), n(8.5, 14, 1.2), n(12, 14, 1.2), n(15.5, 14, 1.2), n(8.5, 17.5, 1.2)],

      kaeufe: [p('M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z'), l(9, 8, 15, 8), l(9, 11.5, 15, 11.5), l(9, 15, 12, 15), n(15, 15, 1.2)],
      mitteilungen: [p('M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z'), n(12, 21, 1.6)],
      profil: [c(12, 8.5, 4), p('M4.5 20.5a7.5 7.5 0 0 1 15 0')],

      listen: [l(9, 7, 20, 7), l(9, 12, 20, 12), l(9, 17, 20, 17), n(5, 7, 1.4), n(5, 12, 1.4), n(5, 17, 1.4)],
      statistik: [p('M4 20.5h16'), p('M4.5 16 9 11.5l4 3 6.5-7.5'), n(9, 11.5), n(13, 14.5), n(19.5, 7)],
      theke: [l(5, 5, 5, 19), l(9, 5, 9, 19), l(13, 5, 13, 19), l(17, 5, 17, 19), l(3, 16, 21, 8)],
      vorstand: [p('M12 3.5 19 6v5.5c0 4.3-2.9 7.7-7 9-4.1-1.3-7-4.7-7-9V6z'), n(12, 11.5, 2.2)],
      admin: [l(4, 7, 20, 7), l(4, 12, 20, 12), l(4, 17, 20, 17), n(9, 7, 2), n(15, 12, 2), n(7, 17, 2)],
      gruppe: [c(9, 8.5, 3.5), p('M3 19.5a6 6 0 0 1 12 0'), c(17, 9, 2.5), p('M16 14a5 5 0 0 1 5 5')]
    };
    const G = [
      ['Gruppe', [['moments', 'Moments', 'Moments.dc.html'], ['dm', 'Direktnachrichten', 'Direktnachrichten.dc.html'], ['statistik', 'Statistik', 'Statistik.dc.html']]],
      ['Mein Konto', [['kalender', 'Kalender', 'Kalender.dc.html'], ['freunde', 'Freunde', 'Freunde.dc.html'], ['bezahlen', 'Bezahlen', 'Bezahlen.dc.html'], ['kaeufe', 'Käufe', 'Kaeufe.dc.html'], ['mitteilungen', 'Mitteilungen', 'Mitteilungen.dc.html'], ['profil', 'Profil', 'Profil.dc.html']]],
      ['Theke', [['katalog', 'Getränkekatalog', 'Katalog.dc.html'], ['listen', 'Getränkelisten', 'Getraenkelisten.dc.html'], ['theke', 'Thekenterminal', 'Theke.dc.html']]],
      ['Verwaltung', [['vorstand', 'Vorstand', 'Vorstand.dc.html'], ['admin', 'Administration', 'AdminMitglieder.dc.html'], ['gruppe', 'Gruppe', 'Gruppeneinstellungen.dc.html']]]

    return {
      theme: this.props.theme ?? 'light',
      groups: G.map(([label, items]) => ({
        label,
        items: items.map(([id, text, href]) => {
          const s = I[id] || [];
          return {
            label: text,
            href,
            strokeD: s.filter((x) => x.s).map((x) => x.s).join(' ') || 'M0 0',

  }
}
</script>
</body>
</html>
