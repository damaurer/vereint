<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kiosk-Geräte</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Kiosk-Geräte" back-href="Vorstand.dc.html" bell="1" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Theke</p>
      <h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Kiosk-Geräte</h2>
      <p style="margin: 0; color: var(--color-text-muted); font-size: 14px; line-height: 1.45">Auf diesen Geräten läuft der Kiosk-Modus. „Entsperren“ beendet ihn ohne PIN; das Gerät verlässt den Modus innerhalb weniger Sekunden.</p>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{devices}}" as="d" hint-placeholder-count="2">
        <li style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--color-border); border-radius: 12px; background-color: var(--color-surface)">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background-color: var(--color-brand-soft); color: var(--color-brand)">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="12" rx="1.5"/><line x1="9" y1="20.5" x2="15" y2="20.5"/><line x1="12" y1="17" x2="12" y2="20.5"/><circle cx="12" cy="11" r="1.8" fill="currentColor" stroke="none"/></svg>
            </span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{d.label}}</span><span style="color: var(--color-text-muted); font-size: 13px">{{d.meta}}</span></span>
            <span class="{{d.badge}}">{{d.status}}</span>
          </div>
          <sc-if value="{{d.locked}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{d.unlock}}" style="height: 44px; border: none; border-radius: 8px; background-color: var(--color-brand); color: var(--color-on-brand); font: inherit; font-size: 15px; font-weight: 700">Entsperren</button>
          </sc-if>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { unlocked: {} };
  }
  renderVals() {
    const D = [['theke', 'Theke Vereinsheim', 'Gestartet am 17.10., 10:26'], ['zelt', 'Festzelt-Tablet', 'Gestartet am 19.07., 13:58']];
    const u = this.state.unlocked;
    return {
      theme: this.props.theme ?? 'light',
      devices: D.map(([id, label, meta]) => {
        const locked = !u[id];
        return {
          label, meta: locked ? meta : 'Kiosk-Modus beendet · gerade eben', locked,
          status: locked ? 'Kiosk aktiv' : 'Entsperrt',
          badge: locked ? 'ui-badge ui-badge-success' : 'ui-badge ui-badge-neutral',
          unlock: () => this.setState({ unlocked: { ...u, [id]: true } })
        };
      })
    };
  }
}
</script>
</body>
</html>
