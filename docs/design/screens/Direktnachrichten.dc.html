<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Direktnachrichten</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Direktnachrichten" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 20px 16px; overflow: hidden">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Über alle Gruppen</p>
        <h2 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Einzelgespräche</h2>
      </div>
      <a href="Freunde.dc.html" style="display: inline-flex; align-items: center; height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">Freunde</a>
    </div>

    <div style="display: flex; gap: 8px">
      <label for="q" class="visually-hidden">Gespräche durchsuchen</label>
      <input id="q" value="{{q}}" onChange="{{onQ}}" placeholder="Gespräche durchsuchen …" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
      <button type="button" aria-label="Neue Nachricht" style="display: grid; place-items: center; width: 44px; height: 44px; border: none; border-radius: 8px; background-color: var(--color-brand); color: var(--color-on-brand)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <h3 style="margin: 0; color: var(--color-text-muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Gespräche ({{count}})</h3>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <li>
          <a href="Gruppenchat.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 12px; background-color: var(--color-surface); color: inherit; text-decoration: none">
            <span style="display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background-color: var(--color-brand); color: var(--color-on-brand); font-size: 14px; font-weight: 800">{{r.initials}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; justify-content: space-between; gap: 8px">
                <span style="font-size: 15px; font-weight: 700">{{r.label}}</span>
                <span style="flex-shrink: 0; color: var(--color-text-muted); font-size: 13px">{{r.time}}</span>
              </span>
              <span style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--color-text-muted); font-size: 14px">{{r.last}}</span>
            </span>
          </a>
        </li>
      </sc-for>
    </ul>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; color: var(--color-text-muted); font-size: 14px; text-align: center">Kein Gespräch passt zu „{{q}}“.</p>
    </sc-if>
  </main>
  <dc-import name="TabBar" active="chat" hint-size="100%,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '' };
  }
  renderVals() {
    const all = [
      { initials: 'TB', label: 'Thomas Berger', time: '10:24', last: 'Danke fürs Aushelfen an der Theke letzte Woche!' },
      { initials: 'JK', label: 'Jonas Keller', time: 'Gestern', last: 'Klar, ich hol dich um 8:15 ab.' },
      { initials: 'MS', label: 'Mia Schulz', time: 'Mo', last: 'Hast du die Fotos vom Sommerfest noch?' }
    ];
    const q = this.state.q.trim().toLowerCase();
    const rows = all.filter((r) => !q || r.label.toLowerCase().includes(q) || r.last.toLowerCase().includes(q));
    return {
      theme: this.props.theme ?? 'light',
      q: this.state.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      rows,
      count: String(rows.length),
      empty: rows.length === 0
    };
  }
}
</script>
</body>
</html>
