<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gastzugang: Weihnachtsfeier</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--color-border); background-color: var(--color-surface)">
    <img src="/_blob/658eacfb311db734fae6de78ff566261" alt="" style="width: 28px; height: 28px; border-radius: 8px">
    <span style="flex: 1; font-size: 17px; font-weight: 800">Vereint</span>
    <span class="ui-chip">Gast · Karin Maier</span>
  </header>

  <section style="flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; padding: 16px; border-bottom: 1px solid var(--color-border); background-color: var(--color-surface)">
    <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Gastzugang</p>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Weihnachtsfeier</h1>
    <p style="margin: 0; color: var(--color-text-muted); font-size: 14px">Mi, 16. Dez · 19:00 · Gasthaus Post, Saal</p>
    <p style="margin: 4px 0 0; color: var(--color-text-muted); font-size: 13px">Als Gast siehst du die Eventdaten und schreibst im Event-Chat mit.</p>
  </section>

  <ol aria-label="Event-Chat" style="flex: 1; min-height: 0; list-style: none; margin: 0; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; overflow: hidden">
    <sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
      <li style="{{m.wrap}}">
        <span style="{{m.bubble}}">
          <span style="display: block; margin-bottom: 2px; font-size: 13px; font-weight: 700">{{m.author}}</span>
          <span style="display: block; font-size: 15px; line-height: 1.4">{{m.text}}</span>
        </span>
        <span style="color: var(--color-text-muted); font-size: 11px">{{m.time}}</span>
      </li>
    </sc-for>
  </ol>

  <form style="flex-shrink: 0; display: flex; gap: 8px; padding: 12px 16px 20px; border-top: 1px solid var(--color-border); background-color: var(--color-surface)">
    <label for="msg" class="visually-hidden">Nachricht</label>
    <input id="msg" value="{{draft}}" onChange="{{onDraft}}" placeholder="Nachricht schreiben …" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid var(--color-border-dark); border-radius: 999px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
    <button type="button" onClick="{{send}}" aria-label="Senden" style="display: grid; place-items: center; width: 48px; height: 48px; border: none; border-radius: 999px; background-color: var(--color-brand); color: var(--color-on-brand)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 20.5 4l-7.5 16.5-2.3-6.7z"/><line x1="10.7" y1="13.8" x2="20.5" y2="4"/></svg>
    </button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: 'Freue mich, bis Mittwoch!',
      list: [
        { author: 'Thomas Berger', text: 'Servus zusammen! Wir haben den Saal ab 19 Uhr.', time: '10:24', me: false },
        { author: 'Jonas Keller', text: 'Bin dabei und bringe noch zwei Gäste mit.', time: '10:26', me: false },
        { author: 'Mia Schulz', text: 'Komme etwas später, so gegen 19:30.', time: '10:31', me: false }
      ]
    };
  }
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: () => {
        const t = this.state.draft.trim();
        if (!t) return;
        this.setState({ draft: '', list: this.state.list.concat([{ author: 'Karin Maier (Gast)', text: t, time: 'jetzt', me: true }]) });
      },
      messages: this.state.list.slice(-5).map((m) => ({
        author: m.author,
        text: m.text,
        time: m.time,
        wrap: 'display: flex; flex-direction: column; gap: 3px; max-width: 82%; ' + (m.me ? 'align-self: flex-end; align-items: flex-end' : 'align-self: flex-start'),
        bubble: 'padding: 10px 12px; border-radius: 14px; ' + (m.me ? 'background-color: var(--color-brand); color: var(--color-on-brand); border-bottom-right-radius: 4px' : 'background-color: var(--color-surface); border: 1px solid var(--color-border); border-bottom-left-radius: 4px')
      }))
    };
  }
}
</script>
</body>
</html>
