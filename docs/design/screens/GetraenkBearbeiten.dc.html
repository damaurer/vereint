<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Getränk bearbeiten</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Katalog-Freigabe" back-href="Vorstand.dc.html" bell="1" hint-size="100%,56px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background-color: rgba(15, 23, 42, 0.4)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="dt" style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; display: flex; flex-direction: column; border-top-left-radius: 16px; border-top-right-radius: 16px; background-color: var(--color-surface)">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 12px 20px; border-bottom: 1px solid var(--color-border)">
      <h1 id="dt" style="margin: 0; font-size: 18px; font-weight: 800">Getränk bearbeiten</h1>
      <a href="KatalogFreigabe.dc.html" aria-label="Schließen" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--color-text-muted)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </a>
    </header>
    <form style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px; overflow: hidden">
      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="nm" style="font-size: 13px; font-weight: 600">Name *</label>
          <input id="nm" value="Helles 0,5 l" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="kt" style="font-size: 13px; font-weight: 600">Strich-Kategorie</label>
          <select id="kt" value="{{cat}}" onChange="{{onCat}}" style="height: 44px; padding: 0 6px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 14px">
            <option value="bier">Bier · 3,50 €</option><option value="af">Alkoholfrei · 2,50 €</option><option value="schnaps">Schnaps · 2,00 €</option><option value="">Ohne</option>
          </select>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="vk" style="font-size: 13px; font-weight: 600">Verkaufspreis (€) *</label>
          <input id="vk" inputmode="decimal" value="{{vk}}" onChange="{{onVk}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px; font-variant-numeric: tabular-nums">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="ek" style="font-size: 13px; font-weight: 600">Einkaufspreis (€)</label>
          <input id="ek" inputmode="decimal" value="{{ek}}" onChange="{{onEk}}" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px; font-variant-numeric: tabular-nums">
        </div>
      </div>
      <p style="margin: 0; padding: 8px 12px; border-radius: 8px; background-color: var(--color-bg); font-size: 14px">An der Theke: <strong style="font-variant-numeric: tabular-nums">{{effective}}</strong> {{source}} · Marge <strong style="font-variant-numeric: tabular-nums">{{margin}}</strong></p>

      <fieldset style="margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: 10px">
        <legend style="padding: 0 4px; font-size: 13px; font-weight: 700">Barcodes</legend>
        <sc-for list="{{codes}}" as="c" hint-placeholder-count="1">
          <div style="display: flex; align-items: center; gap: 8px">
            <code style="flex: 1; padding: 8px 10px; border-radius: 6px; background-color: var(--color-bg); font-size: 14px">{{c.code}}</code>
            <button type="button" onClick="{{c.remove}}" aria-label="Barcode entfernen" style="display: grid; place-items: center; width: 36px; height: 36px; border: none; border-radius: 999px; background: transparent; color: var(--color-text-muted)">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
          </div>
        </sc-for>
        <div style="display: flex; gap: 8px">
          <label for="nb" class="visually-hidden">Neuer Barcode</label>
          <input id="nb" value="{{newCode}}" onChange="{{onCode}}" inputmode="numeric" placeholder="Neuen Barcode erfassen …" style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 15px">
          <button type="button" onClick="{{addCode}}" style="height: 40px; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface); color: var(--color-text); font: inherit; font-size: 14px; font-weight: 600">Hinzufügen</button>
        </div>
      </fieldset>

      <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.4">
        <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: var(--color-brand)">
        Im Sortiment (abwählen, um das Getränk aus dem Verkauf zu nehmen)
      </label>
    </form>
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 12px 20px 24px; border-top: 1px solid var(--color-border)">
      <a href="KatalogFreigabe.dc.html" style="display: grid; place-items: center; height: 48px; box-sizing: border-box; border: 1px solid var(--color-border-dark); border-radius: 8px; color: var(--color-text); font-size: 15px; font-weight: 600; text-decoration: none">Abbrechen</a>
      <a href="KatalogFreigabe.dc.html" style="display: grid; place-items: center; height: 48px; border-radius: 8px; background-color: var(--color-brand); color: var(--color-on-brand); font-size: 15px; font-weight: 700; text-decoration: none">Speichern</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { vk: '3,60', ek: '1,10', cat: 'bier', codes: ['4001234500011'], newCode: '' };
  }
  renderVals() {
    const s = this.state;
    const num = (v) => parseFloat(String(v).replace(',', '.'));
    const catPrice = { bier: 3.5, af: 2.5, schnaps: 2.0 }[s.cat];
    const catName = { bier: 'Bier', af: 'Alkoholfrei', schnaps: 'Schnaps' }[s.cat];
    const eff = s.cat ? catPrice : num(s.vk);
    const m = eff - num(s.ek);
    return {
      theme: this.props.theme ?? 'light',
      cat: s.cat,
      onCat: (e) => this.setState({ cat: e.target.value }),
      effective: isNaN(eff) ? '–' : eff.toFixed(2).replace('.', ',') + ' €',
      source: s.cat ? '(Kategorie ' + catName + ', überschreibt den Verkaufspreis)' : '(eigener Verkaufspreis)',
      vk: s.vk, ek: s.ek,
      onVk: (e) => this.setState({ vk: e.target.value }),
      onEk: (e) => this.setState({ ek: e.target.value }),
      margin: isNaN(m) ? '–' : m.toFixed(2).replace('.', ',') + ' €',
      newCode: s.newCode,
      onCode: (e) => this.setState({ newCode: e.target.value }),
      addCode: () => { const c = s.newCode.trim(); if (c) this.setState({ codes: s.codes.concat([c]).slice(-2), newCode: '' }); },
      codes: s.codes.map((code) => ({ code, remove: () => this.setState({ codes: s.codes.filter((x) => x !== code) }) }))
    };
  }
}
</script>
</body>
</html>
