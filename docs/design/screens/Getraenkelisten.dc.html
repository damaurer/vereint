<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Getränkelisten</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <dc-import name="TopBar" heading="Getränkelisten" bell="1" hint-size="100%,56px"></dc-import>
  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; overflow: hidden">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Event-Vorbereitung</p>
        <h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Getränkelisten</h2>
      </div>
      <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: none; border-radius: 8px; background-color: var(--color-brand); color: var(--color-on-brand); font: inherit; font-size: 14px; font-weight: 700">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Neue Liste
      </button>
    </div>
    <p style="margin: 0; color: var(--color-text-muted); font-size: 14px; line-height: 1.45">Stelle Getränke mit Event-Preisen einmal zusammen und weise die Liste mit einem Klick jedem Event zu.</p>

    <sc-for list="{{lists}}" as="l" hint-placeholder-count="2">
      <article style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--color-border); border-radius: 12px; background-color: var(--color-surface)">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span style="font-size: 16px; font-weight: 700">{{l.label}}</span>
          <span class="ui-chip">{{l.count}} Getränke</span>
        </div>
        <span style="color: var(--color-text-muted); font-size: 13px">{{l.hint}}</span>
        <sc-if value="{{l.open}}" hint-placeholder-val="{{ false }}">
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--color-border)">
            <sc-for list="{{l.items}}" as="i" hint-placeholder-count="3">
              <li style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--color-border); font-size: 14px"><span>{{i.label}}</span><span style="font-weight: 700; font-variant-numeric: tabular-nums">{{i.price}}</span></li>
            </sc-for>
          </ul>
        </sc-if>
        <div style="display: flex; gap: 8px">
          <button type="button" onClick="{{l.toggle}}" aria-expanded="{{l.expanded}}" style="height: 36px; padding: 0 12px; border: none; border-radius: 8px; background-color: var(--color-brand-soft); color: var(--color-brand); font: inherit; font-size: 14px; font-weight: 700">{{l.toggleLabel}}</button>
          <button type="button" style="height: 36px; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface); color: var(--color-text); font: inherit; font-size: 14px; font-weight: 600">Bearbeiten</button>
          <button type="button" style="height: 36px; padding: 0 12px; margin-left: auto; border: none; border-radius: 8px; background: transparent; color: var(--color-danger); font: inherit; font-size: 14px; font-weight: 700">Löschen</button>
        </div>
      </article>
    </sc-for>
  </main>
  <dc-import name="TabBar" active="mehr" hint-size="100%,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'std' };
  }
  renderVals() {
    const L = [
      { id: 'std', label: 'Stammtisch-Standard', hint: 'Die üblichen Getränke für den Vereinsabend.', items: [['Helles 0,5 l', '3,50 €'], ['Weißbier 0,5 l', '3,80 €'], ['Apfelschorle 0,5 l', '2,50 €'], ['Wasser 0,5 l', '1,50 €']], count: 7 },
      { id: 'fest', label: 'Sommerfest', hint: 'Mit Festpreisen und Radler.', items: [['Helles 0,5 l', '4,00 €'], ['Radler 0,5 l', '3,50 €'], ['Spezi 0,5 l', '2,80 €']], count: 10 }
    ];
    return {
      theme: this.props.theme ?? 'light',
      lists: L.map((l) => {
        const open = this.state.open === l.id;
        return {
          label: l.label, hint: l.hint, count: String(l.count), open,
          expanded: open ? 'true' : 'false',
          toggleLabel: open ? 'Einträge ausblenden' : 'Einträge zeigen',
          toggle: () => this.setState({ open: open ? '' : l.id }),
          items: l.items.map(([label, price]) => ({ label, price }))
        };
      })
    };
  }
}
</script>
</body>
</html>
