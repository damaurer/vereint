<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gruppe eröffnen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/vereint/tokens.css">
<link rel="stylesheet" href="ds/vereint/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--color-brand)}a:hover{color:var(--color-brand-strong)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background-color: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); overflow: hidden">
  <header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px">
    <a href="Login.dc.html" aria-label="Zur Anmeldung" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--color-text)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </a>
    <img src="/_blob/658eacfb311db734fae6de78ff566261" alt="Vereint" style="width: 32px; height: 32px; border-radius: 9px">
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <p style="margin: 0; color: var(--color-brand); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Neue Gruppe</p>
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Gruppe eröffnen</h1>
      <p style="margin: 0; color: var(--color-text-muted); font-size: 14px; line-height: 1.5">Lege deine Gruppe und dein Konto in einem Schritt an. Du wirst Admin der Gruppe.</p>
    </div>

    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background-color: var(--color-brand-soft); font-size: 14px; line-height: 1.5">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--color-brand)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="8.5"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="1.2" fill="var(--color-brand)" stroke="none"/></svg>
      <span>Vereint ist kostenlos und ohne Mitgliedergrenze. Mitglieder kommen per Einladungslink dazu.</span>
    </div>

    <form style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="gn" style="font-size: 13px; font-weight: 600">Name der Gruppe</label>
        <input id="gn" value="Stammtisch Hirsch" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="vn" style="font-size: 13px; font-weight: 600">Vorname</label>
          <input id="vn" value="Sabine" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="nn" style="font-size: 13px; font-weight: 600">Nachname</label>
          <input id="nn" value="Wolf" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="em" style="font-size: 13px; font-weight: 600">E-Mail-Adresse</label>
        <input id="em" type="email" value="sabine.wolf@example.de" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="p1" style="font-size: 13px; font-weight: 600">Passwort</label>
          <input id="p1" type="password" value="sicheres-passwort" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="p2" style="font-size: 13px; font-weight: 600">Wiederholen</label>
          <input id="p2" type="password" value="sicheres-passwort" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--color-border-dark); border-radius: 8px; background-color: var(--color-surface-raised); color: var(--color-text); font: inherit; font-size: 16px">
        </div>
      </div>
      <span style="margin-top: -6px; color: var(--color-text-muted); font-size: 12px">Passwort mit mindestens 10 Zeichen.</span>
      <label style="display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; font-size: 14px; line-height: 1.45">
        <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: var(--color-brand)">
        <span>Ich habe die <a href="Impressum.dc.html">AGB</a> gelesen und stimme ihnen zu.</span>
      </label>
      <a href="AdminMitglieder.dc.html" style="display: grid; place-items: center; height: 52px; border-radius: 8px; background-color: var(--color-brand); color: var(--color-on-brand); font-size: 16px; font-weight: 700; text-decoration: none">Gruppe eröffnen</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
