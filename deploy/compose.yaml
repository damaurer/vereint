# Produktions-Stack fuer einen einzelnen Server (siehe deploy/README.md).
#
# Werte kommen aus `.env` neben dieser Datei. Die Datei erzeugt
# `bin/fetch-env.sh` aus dem AWS SSM Parameter Store; sie wird nie eingecheckt.
# Alle Daten liegen unter /srv/vereint/data auf dem separaten, taeglich
# gesicherten Datenvolume.
#
# Nach aussen ist ausschliesslich Caddy erreichbar (80/443). Keycloaks
# Admin-Konsole lauscht nur auf 127.0.0.1 und ist ueber einen
# Session-Manager-Tunnel erreichbar.

name: vereint

x-defaults: &defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  # Keine Linux-Capabilities, ausser ein Dienst braucht sie nachweislich
  # (cap_add am Dienst). Begrenzte Prozesszahl gegen Fork-Bomben.
  cap_drop:
    - ALL
  pids_limit: 512
  logging:
    driver: local

services:
  caddy:
    <<: *defaults
    image: caddy:2.11.7-alpine
    # Caddy laeuft als root im Container und bindet die Ports 80/443.
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN fehlt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/vereint/data/caddy:/data
    networks:
      default:
        # Container erreichen die oeffentliche Domain direkt ueber Caddy, ohne
        # Umweg ueber das Internet (z. B. Token-Aufrufe des BFF an Keycloak).
        aliases:
          - ${PUBLIC_DOMAIN}
    depends_on:
      - webservice
      - keycloak
    mem_limit: 128m

  postgres:
    <<: *defaults
    image: postgres:17.11-alpine
    # Der Entrypoint uebergibt das Datenverzeichnis an den Benutzer postgres
    # und wechselt dann zu ihm; dafuer braucht er genau diese Rechte.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_INITDB_ARGS: --data-checksums
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD fehlt}
      VEREINT_DB_PASSWORD: ${VEREINT_DB_PASSWORD:?VEREINT_DB_PASSWORD fehlt}
    volumes:
      - /srv/vereint/data/postgres:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    shm_size: 128m
    mem_limit: 384m

  keycloak:
    <<: *defaults
    # Keycloak behandelt Signale selbst und erwartet, PID 1 zu sein.
    init: false
    image: ${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE fehlt}
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${PUBLIC_DOMAIN}/kc
      # Admin-Konsole nur ueber den Tunnel auf localhost:8082 (siehe README).
      KC_HOSTNAME_ADMIN: http://localhost:8082/kc
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD fehlt}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30
      # Platzhalter des Realm-Imports
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN}
      SPRING_API_BASE_URL: http://baseservice:8081
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET fehlt}
      KEYCLOAK_TABLET_CLIENT_SECRET: ${KEYCLOAK_TABLET_CLIENT_SECRET:?KEYCLOAK_TABLET_CLIENT_SECRET fehlt}
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET:?KEYCLOAK_REGISTRATION_CLIENT_SECRET fehlt}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf "GET /kc/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 768m

  baseservice:
    <<: *defaults
    image: ${BASESERVICE_IMAGE:?BASESERVICE_IMAGE fehlt}
    # Unveraenderliches Dateisystem; nur /tmp (Tomcat, Uploads) ist beschreibbar.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      VEREINT_DB_URL: jdbc:postgresql://postgres:5432/vereint
      VEREINT_DB_USERNAME: vereint
      VEREINT_DB_PASSWORD: ${VEREINT_DB_PASSWORD}
      EV_LIQUIBASE_ENABLED: "true"
      EV_LIQUIBASE_CONTEXTS: prod
      KEYCLOAK_ISSUER_URI: https://${PUBLIC_DOMAIN}/kc/realms/vereint
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/kc/realms/vereint/protocol/openid-connect/certs
      VEREIN_CORS_ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN}
      S3_ENABLED: "true"
      S3_ENDPOINT: https://${S3_BUCKET:?S3_BUCKET fehlt}.s3.${S3_REGION:?S3_REGION fehlt}.amazonaws.com
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_PATH_STYLE_ACCESS: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY fehlt}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY fehlt}
      DATA_ENCRYPTION_ENABLED: "true"
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY fehlt}
      DATA_ENCRYPTION_KEY_PREVIOUS: ${DATA_ENCRYPTION_KEY_PREVIOUS:-}
      VAPID_ENABLED: ${VAPID_ENABLED:-false}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # Registrierung per Einladungslink: Kontoanlage ueber die Admin-API,
      # direkt im Container-Netz (Caddy sperrt /kc/admin von aussen).
      REGISTRATION_ENABLED: "true"
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080/kc
      KEYCLOAK_REGISTRATION_CLIENT_SECRET: ${KEYCLOAK_REGISTRATION_CLIENT_SECRET}
      # Tarife je Stammtisch (Stripe). Ohne Werte bleibt die Online-Zahlung aus;
      # Parameter in SSM unter /vereint anlegen (siehe README, Abrechnung).
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STAMMTISCH_MONTH: ${STRIPE_PRICE_STAMMTISCH_MONTH:-}
      STRIPE_PRICE_STAMMTISCH_YEAR: ${STRIPE_PRICE_STAMMTISCH_YEAR:-}
      STRIPE_PRICE_VEREIN_MONTH: ${STRIPE_PRICE_VEREIN_MONTH:-}
      STRIPE_PRICE_VEREIN_YEAR: ${STRIPE_PRICE_VEREIN_YEAR:-}
      STRIPE_PRICE_SUPPORTER: ${STRIPE_PRICE_SUPPORTER:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 640m

  webservice:
    <<: *defaults
    image: ${WEBSERVICE_IMAGE:?WEBSERVICE_IMAGE fehlt}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      NODE_ENV: production
      PORT: "8080"
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN}
      SPRING_API_BASE_URL: http://baseservice:8081
      KEYCLOAK_ISSUER_URI: https://${PUBLIC_DOMAIN}/kc/realms/vereint
      KEYCLOAK_REALM: vereint
      KEYCLOAK_CLIENT_ID: vereint-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SESSION_COOKIE_SECURE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}
    depends_on:
      baseservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 256m
